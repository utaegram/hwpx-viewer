/* 훈민정음 — 웹앱(https://utaegram.github.io/hwpx-viewer/)을 WebView 로 감싼 앱.
   AndroidX 의존성 없이 순수 Android SDK 만 쓴다(빌드가 가볍고 깨질 곳이 적다). */
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.utaegram.hunmin'
    compileSdk 34

    defaultConfig {
        applicationId "com.utaegram.hunmin"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"   // 1.2: 빠져 있던 MIME(application/vnd.haansoft-hwp, binary/octet-stream 등) 추가
    }

    buildTypes {
        debug {
            // GitHub Actions 산출물(app-debug.apk)을 그대로 폰에 설치할 수 있게 기본 디버그 키로 서명된다
        }
        release {
            minifyEnabled false
            // 배포용으로 빌드해도 폰에 바로 설치할 수 있도록 디버그 키로 서명한다(스토어 배포용이 아니다)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
