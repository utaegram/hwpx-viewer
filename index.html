<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>훈민정음</title>
<meta name="description" content="브라우저에서 바로 열고 고치는 HWPX 뷰어·에디터. 파일은 서버로 전송되지 않습니다.">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="훈민정음">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo" aria-hidden="true">훈민정음</span>
    <span class="fname" id="fileName">파일을 열어 주세요</span>
    <span class="fstatus" id="fileStatus" hidden></span>
  </div>
  <div class="doc-meter" id="docMeter" hidden>
    <span class="page-info" id="pageInfo">1 / 1쪽</span>
    <span class="dirty-dot" id="dirtyDot" hidden title="수정한 곳이 있습니다"></span>
  </div>
  <div class="actions">
    <button type="button" class="btn ghost sm" id="modeToggle" data-mode="edit" disabled>편집</button>
    <button type="button" class="btn ghost sm" id="replaceBtn" disabled hidden>찾아바꾸기</button>
    <button type="button" class="btn ghost sm" id="openBtn">열기</button>
    <button type="button" class="btn primary sm" id="saveBtn" disabled>저장</button>
  </div>
</header>

<div class="replace-panel" id="replacePanel" hidden>
  <div class="rp-field"><label for="findInput">찾을 내용</label><input id="findInput" type="text" placeholder="예: 이상 없음"></div>
  <div class="rp-field"><label for="replaceInput">바꿀 내용</label><input id="replaceInput" type="text" placeholder="예: 조치 완료"></div>
  <button type="button" class="btn primary sm" id="replaceAllBtn">모두 바꾸기</button>
  <button type="button" class="btn ghost sm" id="replaceCloseBtn">닫기</button>
  <span class="rp-result" id="replaceResult"></span>
</div>

<main id="main">
  <section class="dropzone" id="dropzone">
    <div class="dz-inner">
      <div class="dz-icon" aria-hidden="true">.hwpx</div>
      <h1>훈민정음 · HWPX 열기</h1>
      <p>.hwpx 파일을 이 화면으로 끌어다 놓거나, 파일 선택 버튼을 눌러 주세요.<br>
         문서는 브라우저 안에서만 열리고 어디에도 전송되지 않습니다.</p>
      <button type="button" class="btn primary lg" id="dzOpenBtn">파일 선택</button>
      <p class="dz-note">한글(HWP) 문서의 XML 패키지 형식 · 읽기/편집/저장 지원</p>
      <p class="dz-note"><a href="sample.hwpx" download>예제 .hwpx 파일 내려받기</a></p>
    </div>
  </section>

  <section class="doc-wrap" id="docWrap" hidden>
    <p class="edit-hint" id="editHint">본문이나 표 셀을 눌러 바로 고칠 수 있습니다. 고친 곳은 노란색으로 표시됩니다.</p>
    <div class="doc-pages" id="doc" aria-label="문서 본문"></div>
    <p class="page-foot">훈민정음 · 브라우저에서 로컬로 처리됨</p>
  </section>
</main>

<div class="fs-meter" id="fsMeter" hidden aria-hidden="true">1 / 1쪽</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="drop-overlay" id="dropOverlay" hidden><span>여기에 .hwpx 파일 떨어뜨리기</span></div>
<input type="file" id="fileInput" accept="*/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
